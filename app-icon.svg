<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- QMK Flasher app icon: a keycap with a lightning bolt punched through it.
       Source of truth for every generated icon size — regenerate with:
         npm run tauri icon app-icon.svg
       Kept vector so 16px favicon and 1024px store art come from one shape. -->
  <defs>
    <!-- Keycap body: top-lit, so the icon reads as a physical cap, not a flat square. -->
    <linearGradient id="capBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a333f"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <!-- Inset top surface, shifted up to fake the keycap's sculpted face. -->
    <linearGradient id="capFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333d4b"/>
      <stop offset="1" stop-color="#151a22"/>
    </linearGradient>
    <!-- Bolt runs light-to-dark diagonally so it keeps shape when scaled down. -->
    <linearGradient id="boltFill" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7cf0a8"/>
      <stop offset="0.45" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0f9647"/>
    </linearGradient>
    <filter id="boltGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cap body -->
  <rect x="104" y="104" width="816" height="816" rx="172"
        fill="url(#capBody)" stroke="#3d4956" stroke-width="9"/>

  <!-- Sculpted face: inset on all sides, biased upward (48 top vs 88 bottom) -->
  <rect x="172" y="152" width="680" height="680" rx="126"
        fill="url(#capFace)"/>
  <rect x="172" y="152" width="680" height="680" rx="126"
        fill="none" stroke="#525f70" stroke-width="6" opacity="0.65"/>

  <!-- Bolt: dark backing stroke first for separation from the cap at small sizes,
       then the gradient fill on top. -->
  <g filter="url(#boltGlow)">
    <path d="M 612 200 L 368 552 L 512 552 L 420 824 L 676 462 L 532 462 Z"
          fill="none" stroke="#080b0f" stroke-width="34"
          stroke-linejoin="round" opacity="0.9"/>
    <path d="M 612 200 L 368 552 L 512 552 L 420 824 L 676 462 L 532 462 Z"
          fill="url(#boltFill)"/>
  </g>
</svg>
