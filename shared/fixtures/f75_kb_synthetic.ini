; SYNTHETIC test fixture for scripts/extract-f75-geometry.mjs.
;
; Hand-authored for this repo — NOT vendor data, and NOT a real F75 keymap.
; It is a four-row miniature that reproduces the structural features of the
; OEM KB.ini so the extractor can be tested without shipping AULA's file:
;
;   - `;`-comment labels immediately above each key (the label source)
;   - DISABLED `;`-prefixed lines that must NOT be read as live data
;   - the 0x02 marker (Windows VK) and the 0x09 marker (packed HID output)
;   - a zero-area rectangle (the encoder) that must stay a slot but not be drawn
;   - one row with 1px of vertical jitter, which must still cluster as one row
;   - non-1u keycaps (1.5u, 1.75u, 2u) that exercise the inset derivation
;   - F1 on the documented locked slot 12, for the locked-slot cross-check
;
; Geometry is on a 39px pitch with a 25px drawn 1u key, matching the real
; file's conventions so the derived scale is exercised the same way.

[OPT]
VID=0x258a
PID=0x010C
MatrixLen=128
Name=SYNTHETIC F75 fixture
; A disabled directive — the parser must ignore this entirely.
;KeyNotToSet=14,15,16

[KEY]
;Esc
K1=30,30,55,57, 0x02,0x1B,0x00,0
;F1
K2=108,30,133,57, 0x02,0x70,0x00,12
;`
K3=30,81,55,108, 0x02,0xC0,0x00,1
;1
K4=69,80,94,107, 0x02,0x31,0x00,7
;Backspace
K5=108,81,172,108, 0x02,0x08,0x00,79
;Tab
K6=30,120,74,147, 0x02,0x09,0x00,2
;Q
K7=89,120,114,147, 0x02,0x51,0x00,8
;CapsLock
K8=30,159,84,186, 0x02,0x14,0x00,3
;A
K9=98,159,123,186, 0x02,0x41,0x00,9
; A disabled alternate for A — must not override the live line above.
;K9=98,159,123,186, 0x02,0xFF,0x00,9
;Wheel
K10=0,0,0,0, 0x09,0x01,0x0700001D,84

[FN1]
;Esc
K1=0x09,0x01,0x07000004
;F1
K2=0x09,0x01,0x02000223
;1
K4=0x09,0x01,0x08030200
