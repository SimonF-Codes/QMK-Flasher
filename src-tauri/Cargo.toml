[package]
name = "qmk-flasher"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qmk_flasher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
chrono = "0.4"
# Build-stamp hashing (src/build/stamp.rs). Already in the tree via reqwest's
# rustls stack, so this costs no extra compile.
sha2 = "0.10"
nusb = "0.2.5"
# Raw HID for live key reports. Not nusb: every Moonlander interface binds to
# HidUsb (hidclass.sys) on Windows, while nusb speaks WinUSB and can only claim
# WinUSB-bound interfaces. See src/keyreport/mod.rs.
hidapi = "2"
dfu-core = "0.11.1"
dfu-nusb = "0.2.0"
pollster = "1.0.1"
log = "0.4.33"

[dev-dependencies]
similar = "2"
# Only to reproduce Tauri's runtime context in the msys regression test —
# the app itself must stay tokio-free in build/ (see msys.rs module docs).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
# Compiles the dfu-util.exe fallback Flasher (selected at runtime via
# QMK_FLASHER_DFU_BACKEND=dfu-util). The dfu-core/dfu-nusb backend is
# always compiled and is the default.
dfu-util-fallback = []

